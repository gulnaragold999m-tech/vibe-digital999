<!-- Шапка. Ссылки ведут на настоящие страницы, а не на якоря: якорь
     работает только внутри одной страницы, и на многостраничнике «Услуги»
     с любой внутренней страницы вели бы в никуда. -->
<div class="topbar">
  <nav role="navigation" aria-label="Основное меню">
    <a href="/" class="nav-logo">Vibe Digital 999</a>

    <ul class="nav-links" id="nav-links">
{{NAV_LINKS}}
    </ul>

    <div class="nav-actions">
      <!-- Номер в шапке — кнопка, а не строчка текста. Он и раньше был
           ссылкой tel:, но выглядел обычным текстом, и по нему не нажимали:
           человек не догадывался, что можно. А на телефоне — там, где как раз
           и звонят, — номер вообще прятался правилом display:none.
           Теперь на широком экране кнопка с номером, на узком — круглая
           кнопка с трубкой: номер целиком туда не влезает, а звонок нужен. -->
      <a href="tel:+79992449999" class="nav-phone" data-goal="click_tel"
         aria-label="Позвонить: +7 999 244 99 99">
        <svg class="nav-phone-ico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        <span class="nav-phone-num">+7 999 244 99 99</span>
      </a>
      <a href="{{CTA_HREF}}" class="nav-cta">Заказать</a>
      <button type="button" class="nav-burger" aria-expanded="false"
              aria-controls="nav-links" aria-label="Меню">
        <span aria-hidden="true"></span>
      </button>
    </div>
  </nav>
</div>

<main class="page-main">

<nav class="crumbs" aria-label="Вы находитесь здесь">
  <ol>
{{CRUMBS}}
  </ol>
</nav>
