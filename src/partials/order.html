<!-- ═══════════════════════════════════════════
     ЗАЯВКА

     Одна форма на страницу и один способ её отправить. Всплывающего окна
     здесь нет намеренно: на внутренней странице форма и так в одном экране
     от текста, а второе место, где можно оставить контакт, — это второе
     место, где что-то может сломаться.

     Услуга подставлена заранее, из адреса страницы: человек пришёл читать
     про боты — в заявке будет написано «Telegram-бот», и переспрашивать
     не придётся.
════════════════════════════════════════════ -->
<section id="order-section" class="page-section" aria-label="Форма заявки">
  <div class="order-box">
    <div class="order-eyebrow">Начните работать</div>
    <h2 class="order-title">Оставить заявку</h2>
    <p class="order-sub">Расскажите о задаче. Ответим в течение часа в рабочее время и назовём цену со сроком.</p>

    <form class="order-form" data-lead-form novalidate>
      <div class="form-group">
        <label for="f-name">Ваше имя</label>
        <input type="text" id="f-name" name="name" placeholder="Как вас зовут?" autocomplete="name" required />
      </div>

      <div class="form-group">
        <label for="f-contact">Телефон или почта</label>
        <input type="text" id="f-contact" name="contact" placeholder="+7 999 000 00 00 или почта" autocomplete="tel" required />
      </div>

      <!-- Город. Необязательное поле, и это принципиально: обязательным оно
           отсекает тех, кому всё равно, откуда мы работаем, — а таких среди
           удалённых заказов большинство. Зато у заполнивших сразу виден
           регион, и по заявкам понятно, какая реклама из трёх работает.

           Подсказки — datalist, а не выпадающий список: поле остаётся
           текстовым, свой город можно вписать целиком. Список городов
           собирается из src/cities.js. -->
      <div class="form-group">
        <label for="f-city">Ваш город <span class="form-opt">— необязательно</span></label>
        <input type="text" id="f-city" name="city" list="city-list"
               placeholder="Например: Пятигорск, Краснодар, Красноярск"
               autocomplete="address-level2" />
        <datalist id="city-list">
        {{CITY_OPTIONS}}
        </datalist>
        <p class="form-hint" data-city-hint>Поможет быстрее рассчитать стоимость и предложить подходящий формат работы.</p>
      </div>

      <div class="form-group">
        <label for="f-comment">Опишите задачу</label>
        <textarea id="f-comment" name="comment" rows="4" placeholder="Что нужно сделать и к какому сроку"></textarea>
      </div>

      <input type="hidden" id="f-service" name="service" value="{{SERVICE}}" />

      <!-- Выбранный пакет. Заполняется сам, если человек пришёл в форму
           с кнопки пакета на /pakety/, и остаётся пустым во всех остальных
           случаях. Спрашивать напрямую — «у вас микро или малый бизнес?» —
           нельзя: вопрос звучит как проверка платёжеспособности, и половина
           закроет форму. А нажатие на «Обсудить «Поток»» — это тот же ответ,
           только данный добровольно.

           Три поля, а не одно: в заявке нужно видеть и название пакета,
           и по какому масштабу человек себя узнал, и что в этот пакет
           входит. Иначе через месяц «Поток» — это просто слово. -->
      <input type="hidden" id="f-package" name="package" value="" />
      <input type="hidden" id="f-segment" name="segment" value="" />
      <input type="hidden" id="f-parts" name="package_parts" value="" />

      <!-- Две галочки, а не одна. Согласие на обработку данных и ознакомление
           с политикой — разные действия, и закон разводит их намеренно: одна
           общая галочка «согласен со всем» не считается конкретным и
           информированным согласием. Обе пустые: отметить их должен человек,
           это его действие, а не состояние по умолчанию. -->
      <label class="consent">
        <input type="checkbox" id="f-consent" data-consent required />
        <span>Даю <a href="/privacy.html#consent" target="_blank" rel="noopener">согласие на обработку персональных данных</a> — имени и контакта, чтобы со мной связались по этой заявке</span>
      </label>

      <label class="consent">
        <input type="checkbox" id="f-policy" data-policy required />
        <span>Ознакомлен с <a href="/privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a></span>
      </label>

      <p class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn-submit">
        <span class="btn-text">Отправить заявку</span>
        <span class="btn-loader"></span>
      </button>
    </form>

    <!-- Сообщение об успехе стоит СНАРУЖИ формы, а не внутри неё. После
         отправки форма прячется целиком — вместе со всем, что лежит внутри.
         Спрятанное сообщение об успехе человек не увидит, решит, что заявка
         не ушла, и отправит её второй раз или уйдёт. -->
    <div class="form-success">
      <span class="success-icon">✦</span>
      <div class="success-text">Заявка принята!</div>
      <div class="success-sub">Ответим в течение часа в рабочее время.</div>
    </div>
  </div>
</section>
